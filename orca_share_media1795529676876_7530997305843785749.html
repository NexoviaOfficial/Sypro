/* Draft game only */

.draft-equal-card{
  height:248px;
}

@media (max-width:420px){
  .draft-equal-card{
    height:236px;
  }
}

.draft-hover{
  transition:transform .25s ease, box-shadow .25s ease;
}

.draft-hover:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(37,99,235,.45);
}

.draft-hover:active{
  transform:translateY(-2px) scale(.99);
}

.draft-glow{
  animation:draftGlow 1.6s ease-in-out infinite;
}

@keyframes draftGlow{
  0%,100%{
    box-shadow:0 0 0 rgba(37,99,235,0);
  }

  50%{
    box-shadow:0 0 26px rgba(37,99,235,.60);
  }
}

.draft-pulse-dot{
  width:8px;
  height:8px;
  border-radius:9999px;
  background:#34D399;
  display:inline-block;
  animation:draftPulse 1s ease-in-out infinite;
}

@keyframes draftPulse{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.45;
    transform:scale(.65);
  }
}

.draft-row-in{
  animation:draftRowIn .45s cubic-bezier(.2,1.4,.4,1) both;
}

@keyframes draftRowIn{
  0%{
    opacity:0;
    transform:translateY(-14px) scale(.96);
  }

  60%{
    opacity:1;
    transform:translateY(3px) scale(1.01);
  }

  100%{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.draft-confetti{
  position:absolute;
  top:-12px;
  width:9px;
  height:14px;
  border-radius:2px;
  animation:draftFall 2.4s ease-in forwards;
}

@keyframes draftFall{
  to{
    transform:translateY(108vh) rotate(540deg);
    opacity:.9;
  }
}

.draft-flip-inner{
  transition:transform 700ms ease;
  transform-style:preserve-3d;
  position:relative;
  width:100%;
  height:100%;
}

.draft-face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}

.draft-face-back{
  transform:rotateY(180deg);
}

/* Auction game only */

.auction-glow{
  animation:draftGlow 1.6s ease-in-out infinite;
}

.auction-shake{
  animation:auctionShake .45s ease-in-out;
}

@keyframes auctionShake{
  0%,100%{
    transform:translateX(0);
  }

  20%{
    transform:translateX(-7px);
  }

  40%{
    transform:translateX(7px);
  }

  60%{
    transform:translateX(-5px);
  }

  80%{
    transform:translateX(5px);
  }
}
